version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: abbeygate_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: abbeygate_uw
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: abbeygate_redis
    ports:
      - "6379:6379"

  # Org2Vec graph store (ADR-0041 / ADR-0044). Off-the-critical-path
  # enrichment — the app degrades gracefully when this is absent. Local
  # demo only; production uses AuraDB or an in-cluster StatefulSet in the
  # dedicated `org2vec` namespace.
  neo4j:
    image: neo4j:5-community
    container_name: abbeygate_neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data

  adminer:
    image: adminer
    container_name: abbeygate_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  neo4j_data:
