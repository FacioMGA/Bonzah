{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "abbeygate.fullname" . }}-worker-health
  labels:
    {{- include "abbeygate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- include "abbeygate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: health
      port: {{ .Values.worker.probe.port }}
      targetPort: {{ .Values.worker.probe.port }}
{{- end }}
