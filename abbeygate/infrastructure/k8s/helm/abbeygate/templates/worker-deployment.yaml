{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abbeygate.fullname" . }}-worker
  labels:
    {{- include "abbeygate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: {{ .Values.worker.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker.strategy.maxUnavailable }}
      maxSurge: {{ .Values.worker.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "abbeygate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "abbeygate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "abbeygate.serviceAccountName" . }}
      {{- if .Values.nodeSelector.worker }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector.worker | nindent 8 }}
      {{- end }}
      {{- if .Values.keyVault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/{{ .Values.worker.imageRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.worker.probe.port }}
              name: health
          env:
            - name: QUEUE_WORKERS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtimeConfig.configMapName }}
                  key: QUEUE_WORKERS_ENABLED_WORKER
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.worker.env.WORKER_HEALTH_PORT | quote }}
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtimeConfig.configMapName }}
                  key: NODE_ENV
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtimeConfig.configMapName }}
                  key: SENTRY_ENVIRONMENT
            - name: SENTRY_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtimeConfig.configMapName }}
                  key: SENTRY_RELEASE
            {{- range $envName, $secretKey := .Values.runtimeConfig.secretKeys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeConfig.secretName }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- range $envName, $secretKey := .Values.runtimeConfig.optionalSecretKeys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeConfig.secretName }}
                  key: {{ $secretKey }}
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.worker.startupProbe.path }}
              port: health
            periodSeconds: {{ .Values.worker.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.worker.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probe.path }}
              port: health
            initialDelaySeconds: {{ .Values.worker.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probe.path }}
              port: health
            initialDelaySeconds: {{ .Values.worker.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probe.periodSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.keyVault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
{{- end }}
