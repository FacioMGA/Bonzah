{{- if .Values.issuanceProof.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "abbeygate.fullname" . }}-issuance-proof
  labels:
    {{- include "abbeygate.labels" . | nindent 4 }}
    app.kubernetes.io/component: issuance-proof
spec:
  schedule: {{ .Values.issuanceProof.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.issuanceProof.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.issuanceProof.ttlSecondsAfterFinished }}
      activeDeadlineSeconds: {{ .Values.issuanceProof.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "abbeygate.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: issuance-proof
        spec:
          serviceAccountName: {{ include "abbeygate.serviceAccountName" . }}
          restartPolicy: Never
          {{- if .Values.nodeSelector.worker }}
          nodeSelector:
            {{- toYaml .Values.nodeSelector.worker | nindent 12 }}
          {{- end }}
          {{- if .Values.keyVault.enabled }}
          volumes:
            - name: secrets-store-inline
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
          {{- end }}
          containers:
            - name: issuance-proof
              image: "{{ .Values.image.registry }}/{{ .Values.worker.imageRepository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "./node_modules/tsx/dist/cli.mjs", "tools/quality/ops/prove-issued-docs-and-email.ts"]
              env:
                - name: NODE_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: {{ .Values.runtimeConfig.configMapName }}
                      key: NODE_ENV
                {{- range $envName, $envValue := .Values.issuanceProof.env }}
                - name: {{ $envName }}
                  value: {{ $envValue | quote }}
                {{- end }}
                {{- range $envName, $secretKey := .Values.runtimeConfig.secretKeys }}
                - name: {{ $envName }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.runtimeConfig.secretName }}
                      key: {{ $secretKey }}
                {{- end }}
                {{- range $envName, $secretKey := .Values.runtimeConfig.optionalSecretKeys }}
                - name: {{ $envName }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.runtimeConfig.secretName }}
                      key: {{ $secretKey }}
                      optional: true
                {{- end }}
              resources:
                {{- toYaml .Values.worker.resources | nindent 16 }}
              {{- if .Values.keyVault.enabled }}
              volumeMounts:
                - name: secrets-store-inline
                  mountPath: /mnt/secrets-store
                  readOnly: true
              {{- end }}
{{- end }}
