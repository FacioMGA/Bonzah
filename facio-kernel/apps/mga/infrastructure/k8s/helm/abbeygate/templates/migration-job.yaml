{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "abbeygate.fullname" . }}-migration
  labels:
    {{- include "abbeygate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "abbeygate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: {{ include "abbeygate.serviceAccountName" . }}
      restartPolicy: Never
      {{- if .Values.nodeSelector.api }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector.api | nindent 8 }}
      {{- end }}
      containers:
        - name: migration
          image: "{{ .Values.image.registry }}/{{ .Values.api.imageRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              npx prisma migrate resolve --rolled-back 20260601190000_seed_business_open_market_manual_products || true
              npm run prisma:migrate:deploy
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtimeConfig.configMapName }}
                  key: NODE_ENV
            {{- range $envName, $secretKey := .Values.runtimeConfig.secretKeys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeConfig.secretName }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- range $envName, $secretKey := .Values.runtimeConfig.optionalSecretKeys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeConfig.secretName }}
                  key: {{ $secretKey }}
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
