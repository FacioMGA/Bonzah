apiVersion: batch/v1
kind: Job
metadata:
  name: bdx-import
  namespace: faciomga-prod
  labels:
    app.kubernetes.io/name: abbeygate
    app.kubernetes.io/component: bdx-import
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 43200  # 12 hours max
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abbeygate
        app.kubernetes.io/component: bdx-import
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bdx-import
          image: node:22-bookworm-slim
          command: ["node"]
          args: ["--input-type=module", "-e", "import('./import.mjs')"]
          workingDir: /bdx
          env:
            - name: BDX_ENDPOINT
              value: "http://abbeygate-abbeygate-api/api/policies/imports/bdx"
            - name: BDX_REQUEST_TIMEOUT_MS
              value: "600000"
            - name: BDX_UPLOAD_FILE
              value: "true"
            - name: BDX_OUTPUT_DIR
              value: "/bdx/artifacts"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: abbeygate-runtime-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: abbeygate-runtime-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: bdx-scripts
              mountPath: /bdx
            - name: bdx-source
              mountPath: /bdx/source
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: bdx-scripts
          configMap:
            name: bdx-import-scripts
        - name: bdx-source
          configMap:
            name: bdx-import-source
