# Neo4j single-instance StatefulSet (ADR-0041 §9 Option B).
# Dev / demo only — production should run Neo4j AuraDB and SKIP this
# manifest entirely (the org2vec-worker reads NEO4J_URI from Key Vault).
#
# CHAMPS guard `check-neo4j-no-app-pod-coupling` requires this manifest
# to live in `namespace: org2vec`, never alongside the api / worker.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: org2vec
  labels:
    app: neo4j
    component: graph-enrichment
    adr: ADR-0041
spec:
  replicas: 1
  serviceName: neo4j
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        critical-path: "false"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: neo4j
          image: neo4j:5.20-community
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_AUTH
            - name: NEO4J_server_memory_pagecache_size
              value: "1G"
            - name: NEO4J_server_memory_heap_initial__size
              value: "1G"
            - name: NEO4J_server_memory_heap_max__size
              value: "2G"
            - name: NEO4J_db_tx__log_rotation_retention__policy
              value: "1G size"
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: org2vec
  labels:
    app: neo4j
spec:
  clusterIP: None # headless; org2vec-worker resolves neo4j.org2vec.svc.cluster.local
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
